version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=nanobanana_db
      - DB_USER=admin
      - DB_PASSWORD=secret_pass
    depends_on:
      - db

  db:
    image: postgres:13-alpine
    environment:
      - POSTGRES_DB=nanobanana_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
